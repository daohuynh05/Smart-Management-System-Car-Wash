name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autowash_test
          POSTGRES_USER: autowash_test
          POSTGRES_PASSWORD: autowash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autowash_test -d autowash_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/autowash_test
      TEST_DATABASE_USERNAME: autowash_test
      TEST_DATABASE_PASSWORD: autowash_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package with isolated PostgreSQL
        run: bash mvnw -B -ntp verify
      - name: Build backend image
        run: docker build -t autowash-backend:ci .
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: target/surefire-reports
          if-no-files-found: ignore
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      FRONTEND_PATH: ./frontend
      POSTGRES_PASSWORD: ci-demo-db
      JWT_SECRET: YXV0b3dhc2gtY2ktb25seS1rZXktMzItYnl0ZXMhISEhISE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: daohuynh05/FE-SmartWashCar
          path: frontend
      - name: Start demo stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Check login and role isolation through frontend proxy
        run: python3 scripts/smoke_demo.py http://localhost:3000
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up disposable demo
        if: always()
        run: docker compose down --volumes
