# Push both repositories before importing this Blueprint.
services:
  - type: web
    name: autowash-demo-api
    runtime: docker
    repo: https://github.com/daohuynh05/Smart-Management-System-Car-Wash
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase: {name: autowash-demo-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: autowash-demo-db, property: port}
      - key: DB_NAME
        fromDatabase: {name: autowash-demo-db, property: database}
      - key: DB_USERNAME
        fromDatabase: {name: autowash-demo-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: autowash-demo-db, property: password}
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEMO_CUSTOMER_PASSWORD
        value: CustomerDemo!2026
      - key: DEMO_ADMIN_PASSWORD
        value: AdminDemo!2026
  - type: web
    name: autowash-demo-web
    runtime: static
    repo: https://github.com/daohuynh05/FE-SmartWashCar
    branch: main
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: autowash-demo-db
    region: singapore
    plan: free
    databaseName: autowash_demo
    user: autowash_demo
    ipAllowList: []
