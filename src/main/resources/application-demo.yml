# Use only with a dedicated, disposable demo database.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autowash_demo}
    username: ${DB_USERNAME:autowash_demo}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    # Existing migrations do not yet cover every entity.
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    baseline-on-migrate: false
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
jwt:
  secret: ${JWT_SECRET}
demo:
  customer-password: ${DEMO_CUSTOMER_PASSWORD:CustomerDemo!2026}
  admin-password: ${DEMO_ADMIN_PASSWORD:AdminDemo!2026}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
